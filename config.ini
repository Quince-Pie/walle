# Global renderer configuration. Use auto, discrete, integrated, a Vulkan
# device index printed at startup, or a case-insensitive device-name substring.
# Command-line --vulkan-device and WALLE_VK_DEVICE override this setting.
[walle]
vulkan_device = auto

# Configuration for the primary display
[HDMI-A-1]
# make sure you place a tab for each file/directory
files =
			# entropy
			fill:IMAGE_FULL_PATH
			# OR entire directory
			fill:IMAGES_DIRECTORY_FULL_PATH
			# upper portion
			fill_low:IMAGE_FULL_PATH
			# center portion
			fill_center:IMAGE_FULL_PATH
			# lower portion
			fill_high:IMAGE_FULL_PATH
			# portion with face/s
			fill_attention:IMAGE_FULL_PATH
			fill_entropy:IMAGE_FULL_PATH
			stretch:IMAGE_FULL_PATH
			fit:IMAGE_FULL_PATH

# timeout in seconds before image switch [0 = no switch]
# switches are aligned to a whole-second grid so monitors sharing a timeout
# wake the daemon once (first switch may land up to 1s late)
timeout = 15
# smooth Liquid Glass transition [default: false]
transition = true
# transition length in seconds (wall-clock) [NOOP when transition=false]
transition_duration = 8
# Liquid Glass variant: clear | regular [default: clear]
# clear   = highly translucent, wallpaper stays prominent through the glass
#           (Apple's pick for media backgrounds like photos/videos; adds the
#           HIG 35% dimming layer automatically over bright content)
# regular = frosted platter that adapts its luminosity to the content
#           (bright milky over light images, near-opaque dark over dark ones)
transition_variant = clear
# The reveal uses the recovered public-input two-family mesh and R8 mask. The
# production mask shaders currently reproduce
# 272,629,669/272,629,760 retained pixels through Vulkan 1.4 and offline
# Slang/SPIR-V 1.6; the diagnostic 65-state Walle process path produces the
# same mask bytes on both tested AMD GPUs. Clear/regular composed presentation
# bytes are regression-tested as distinct, but Apple composed output and
# physical presentation remain unscored.
# Apple's arbitrary non-axis-separable post-guard setup law remains unknown.
# Radius follows linear transition progress.
# random order [default: false]
randomize = true
# respect gamemode (disable cycling until game session is off) [default: true]
gamemode = true

# Configuration for a secondary display
[DP-1]
files =
			# entropy
			fill:IMAGE_FULL_PATH
			# OR entire directory
			fill:IMAGES_DIRECTORY_FULL_PATH
			# upper portion
			fill_low:IMAGE_FULL_PATH
			# center portion
			fill_center:IMAGE_FULL_PATH
			# lower portion
			fill_high:IMAGE_FULL_PATH
			# portion with face/s
			fill_attention:IMAGE_FULL_PATH
			fill_entropy:IMAGE_FULL_PATH
			stretch:IMAGE_FULL_PATH
			fit:IMAGE_FULL_PATH

timeout = 60
transition = true
randomize = true
transition_duration = 10
transition_variant = regular
