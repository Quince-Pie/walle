[walle]
# auto prefers a suitable discrete GPU; explicit integrated/discrete/name also work.
vulkan_device = auto

[default]
files =
    fill:~/.config/bg

# Seconds between wallpapers. Zero disables cycling.
timeout = 60
randomize = true
gamemode = true
transition = true
transition_duration = 2.4
# Source-derived Apple public material: clear | regular.
transition_variant = clear
# auto follows the desktop portal color scheme; light | dark are explicit.
# Without a portal preference, auto starts light. Changes apply to the next transition.
transition_appearance = auto
# Same extracted optics; application movement: sweep | lens.
transition_motion = sweep
# none, #RRGGBB, or #RRGGBBAA. Tint presence and transparent tint differ.
transition_tint = none

# A named output section replaces the default section for that output.
# Copy the settings above into [DP-1], [HDMI-A-1], etc. for independent choices.
