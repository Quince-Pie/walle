# Configuration for the primary display
[HDMI-A-1]
# make sure you place a tab for each file/directory
files =
			# entropy
			fill:IMAGE_FULL_PATH
			# OR entire directory
			fill:IMAGES_DIRECTORY_FULL_PATH
			# upper portion
			fill_low:IMAGE_FULL_PATH
			# center portion
			fill_center:IMAGE_FULL_PATH
			# lower portion
			fill_high:IMAGE_FULL_PATH
			# portion with face/s
			fill_attention:IMAGE_FULL_PATH
			fill_entropy:IMAGE_FULL_PATH
			stretch:IMAGE_FULL_PATH
			fit:IMAGE_FULL_PATH

# timeout in seconds before image switch [0 = no switch]
# switches are aligned to a whole-second grid so monitors sharing a timeout
# wake the daemon once (first switch may land up to 1s late)
timeout = 15
# smooth Liquid Glass transition [default: false]
transition = true
# transition length in seconds (wall-clock) [NOOP when transition=false]
transition_duration = 8
# Liquid Glass variant: clear | regular [default: clear]
# clear   = translucent veil (measured from real macOS glass: ~50% scrim over
#           a heavy blur + edge lensing); the wallpaper glows through it —
#           Apple's pick for media backgrounds like photos/videos
# regular = the opaque platter: solid white over light content, deep charcoal
#           over dark, with only a hue wash of the wallpaper (macOS-exact)
transition_variant = clear
# random order [default: false]
randomize = true
# respect gamemode (disable cycling until game session is off) [default: true]
gamemode = true

# Configuration for a secondary display
[DP-1]
files =
			# entropy
			fill:IMAGE_FULL_PATH
			# OR entire directory
			fill:IMAGES_DIRECTORY_FULL_PATH
			# upper portion
			fill_low:IMAGE_FULL_PATH
			# center portion
			fill_center:IMAGE_FULL_PATH
			# lower portion
			fill_high:IMAGE_FULL_PATH
			# portion with face/s
			fill_attention:IMAGE_FULL_PATH
			fill_entropy:IMAGE_FULL_PATH
			stretch:IMAGE_FULL_PATH
			fit:IMAGE_FULL_PATH

timeout = 60
transition = true
randomize = true
transition_duration = 10
transition_variant = regular
